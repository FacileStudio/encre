# encre coding standard, enforced by filet (https://github.com/FacileStudio/filet).
#
#   filet check .     the rules
#
# Limits are the suite's lib standard (tronc, muse). encre ships Rust, TypeScript and
# Svelte, so the extensions follow what this repository actually ships.

kind: lib

ignore:
  - .git
  - node_modules
  - target
  - coverage
  - .svelte-kit
  - src/lib/encre-wasm   # wasm-pack output, generated by scripts/build-wasm.sh

extensions: [.rs, .ts, .svelte, .sh]

limits:
  fileLines: 250
  funcsPerFile: 8
  funcLines: 30
  funcStatements: 25
  lineLength: 120
  params: 5
  returns: 3
  nesting: 4
  complexity: 10
  structFields: 12
  interfaceMethods: 4

style:
  banInlineComments: true
  banTODO: true
  requireDocComments: true
  banGlobalMutable: true
  banInit: true
  banTrailingSpace: true

disabled:
  - gen.line.long   # rustfmt and the Svelte formatter own line breaking

failOn: error
