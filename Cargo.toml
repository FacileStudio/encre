[workspace]
resolver = "3"
members = ["crates/encre", "crates/encre-wasm"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/FacileStudio/encre"
rust-version = "1.98"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.test]
opt-level = 2
