[workspace]
resolver = "3"
members = ["crates/encre", "crates/encre-cli", "crates/encre-wasm"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/FacileStudio/encre"
rust-version = "1.98"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.test]
opt-level = 2

[patch.crates-io]
citationberg = { git = "https://github.com/typst/citationberg", rev = "06a591e2f237d25e1dfdedac3f3d1494c496c52d" }
