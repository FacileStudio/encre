name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.98.1 with rustfmt, clippy and the wasm32 target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default 1.98.1
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.98.1-

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack@0.15.1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      - uses: FacileStudio/filet@744b06fb5c4ad7d6a86014a0ebe7700a3553ca54 # v0.19.1
        env:
          GOTOOLCHAIN: auto
        with:
          version: v0.19.1
          fail-on: error
          antenne-url: ${{ secrets.ANTENNE_FILET_SECRET != '' && 'https://antenne.facile.studio/webhook/filet' || '' }}
          antenne-secret: ${{ secrets.ANTENNE_FILET_SECRET }}

      - name: check
        run: mise run check

      - name: test
        run: mise run test
